[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Route API requests to Netlify Functions if deployed
[[redirects]]
  from = "/api/solve"
  to = "/.netlify/functions/solve"
  status = 200

# Single Page App routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
